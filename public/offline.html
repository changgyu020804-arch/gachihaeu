<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176bff" />
    <title>같이해U - 오프라인</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #111827;
        background: #eef3f9;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 38px 28px;
        text-align: center;
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(20, 36, 63, 0.14);
      }
      .logo { font-size: 28px; font-weight: 900; letter-spacing: -2px; }
      .logo span { color: #176bff; }
      h1 { margin: 26px 0 10px; font-size: 22px; }
      p { margin: 0 0 24px; color: #697386; font-size: 14px; line-height: 1.6; }
      button {
        width: 100%;
        height: 48px;
        color: white;
        background: #176bff;
        border: 0;
        border-radius: 13px;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">같이해<span>U</span></div>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>연결이 복구되면 다시 시도해 주세요.<br />저장된 로그인 정보는 유지됩니다.</p>
      <button type="button" onclick="location.reload()">다시 연결하기</button>
    </main>
  </body>
</html>
